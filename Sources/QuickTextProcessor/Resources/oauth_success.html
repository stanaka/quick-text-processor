<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QuickTextProcessor — signed in</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f5f5f7; color: #1d1d1f;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 56px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
    }
    .check { font-size: 44px; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #6e6e73; margin: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f5f5f7; }
      .card { background: #2c2c2e; }
      p { color: #98989d; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Signed in</h1>
    <p>You can close this tab and return to QuickTextProcessor.</p>
  </div>
</body>
</html>
